<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website Time Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="20" height="20" />
        <span>Time Tracker</span>
      </div>
      <div id="status" class="status" data-state="loading">…</div>
    </header>

    <section class="hero">
      <p class="eyebrow">Today</p>
      <p id="today-total" class="total">—</p>
    </section>

    <section class="list-wrap">
      <div class="list-head">
        <span>Top sites</span>
        <span id="site-count"></span>
      </div>
      <ol id="top-list" class="top-list"></ol>
      <p id="empty" class="empty hidden">No browsing time recorded yet today.</p>
    </section>

    <footer class="footer">
      <button id="open-dashboard" type="button">Open full dashboard</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
